name: Plugin APK

# The SFPEW renderer plugin (android-plugin/): the wrapper and the backends it
# can run on - the system's GLES/EGL, MobileGlues (main branch) and MobileGL
# (dev branch) - all built from source here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      SFPEW_CMAKE_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout SFPEW
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The backends, at the paths android-plugin/settings.gradle.kts includes
      # them from. Each is built from its own Gradle library module.
      - name: Checkout MobileGlues (main)
        uses: actions/checkout@v6
        with:
          repository: MobileGL-Dev/MobileGlues
          ref: main
          path: android-plugin/backends/MobileGlues
          submodules: recursive

      - name: Checkout MobileGL (dev)
        uses: actions/checkout@v6
        with:
          repository: MobileGL-Dev/MobileGL
          ref: dev
          path: android-plugin/backends/MobileGL
          submodules: recursive

      - name: Set artifact metadata
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "mobileglues_sha=$(git -C android-plugin/backends/MobileGlues rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "mobilegl_sha=$(git -C android-plugin/backends/MobileGL rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-apk-${{ github.job }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-apk-${{ github.job }}-ccache-

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      # The wrapper's module pins one NDK and both backends another.
      - name: Install Android NDKs
        run: sdkmanager "ndk;27.0.12077973" "ndk;27.3.13750724"

      - name: Update MobileGL's glslang external sources
        working-directory: android-plugin/backends/MobileGL/3rdparty/glslang
        run: python update_glslang_sources.py

      # Signed with MobileGL's key (android-plugin/keystore.jks, the same file
      # MobileGL's plugin commits) when the repository has its passwords as
      # secrets; without them, with the debug key, so a fork's APK still installs.
      - name: Build plugin APK
        run: ./gradlew --no-daemon :app:assembleRelease -Psfpew.apkSuffix="${GITHUB_SHA}" --max-workers "$(nproc)"
        working-directory: android-plugin
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      # One rolling cache entry per job on the default branch: keys are
      # immutable, so the superseded entry is released before the same key is
      # saved again. After the build, so a failed build keeps the old entry.
      - name: Release superseded ccache entry
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ runner.os }}-apk-${{ github.job }}-ccache-v1
        run: gh cache delete "${CACHE_KEY}" || true

      - name: Save ccache
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-apk-${{ github.job }}-ccache-v1

      # The APK has to carry the wrapper and every backend it offers, signed;
      # a launcher only finds out otherwise when a game fails to start.
      - name: Verify APK
        run: |
          apk="android-plugin/app/build/outputs/apk/release/SFPEW-plugin-release-${GITHUB_SHA}.apk"
          test -f "${apk}"
          for library in libSimpleFPEWrapper.so libmobileglues.so libMobileGL.so; do
            if ! unzip -l "${apk}" | grep -q "lib/arm64-v8a/${library}"; then
              echo "::error::${library} is missing from the APK"
              exit 1
            fi
          done
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          "$AAPT2" dump badging "${apk}" | head -n 1
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "${apk}"

      - name: Upload plugin APK
        uses: actions/upload-artifact@v7
        with:
          name: SFPEW-plugin-${{ env.date_today }}-${{ github.sha }}-mobileglues-${{ env.mobileglues_sha }}-mobilegl-${{ env.mobilegl_sha }}
          path: android-plugin/app/build/outputs/apk/release/SFPEW-plugin-release-${{ github.sha }}.apk
          archive: false
          if-no-files-found: error
