# ============================================================
# 架构层面说明
# ============================================================

architecture_notes:
  - >
    透传功能 (Pass-through to backend): 以下功能未在 wrapper 层实现，但现代 GL 后端天然支持，
    直接透传后行为正确，通常不需要额外模拟:
    - glEnable/glDisable (GL_DEPTH_TEST, GL_BLEND, GL_CULL_FACE, GL_STENCIL_TEST, GL_SCISSOR_TEST, GL_POLYGON_OFFSET_FILL, GL_DITHER, GL_MULTISAMPLE, GL_SAMPLE_ALPHA_TO_COVERAGE)
    - glDepthFunc, glDepthMask, glBlendFunc, glBlendEquation, glStencilFunc, glStencilOp, glStencilMask
    - glCullFace, glFrontFace, glPolygonMode, glPolygonOffset, glLineWidth, glPointSize
    - glScissor, glViewport, glClear, glColorMask, glLogicOp
    - glFlush, glFinish, glHint
    - glBindTexture, glActiveTexture, glGenTextures, glDeleteTextures
    - glTexParameterf/i/fv/iv
    - glTexImage1D/2D/3D, glTexSubImage1D/2D/3D
    - glCopyTexImage1D/2D, glCopyTexSubImage1D/2D/3D
    - glGenBuffers, glBindBuffer, glBufferData, glDeleteBuffers 等 VBO 函数 (ARB 后缀自动转换)
    - glEnableVertexAttribArray, glDisableVertexAttribArray, glVertexAttribPointer 等现代 VAO 函数
