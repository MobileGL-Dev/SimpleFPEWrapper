# ============================================================
# 完全实现 (Fully Implemented)
# ============================================================

fully_implemented:

  - category: "矩阵操作 Matrix Operations"
    status: done
    functions:
      - glMatrixMode
      - glLoadIdentity
      - glPushMatrix
      - glPopMatrix
      - glOrtho
      - glOrthof
      - glScalef
      - glTranslatef
      - glRotatef
      - glMultMatrixf
      - glRotated
      - glScaled
      - glTranslated
    notes: >
      四组矩阵栈完整实现 (ModelView/Projection/Texture/Color)。
      double 版本通过 cast 到 float 实现，存在精度损失风险。
      glGetFloatv 可正确返回 GL_MODELVIEW_MATRIX 和 GL_PROJECTION_MATRIX。

  - category: "顶点数组 Vertex Arrays / Client State"
    status: done
    functions:
      - glVertexPointer
      - glNormalPointer
      - glColorPointer
      - glTexCoordPointer
      - glIndexPointer
      - glEnableClientState
      - glDisableClientState
      - glClientActiveTexture
    notes: >
      支持 buffer-based 和 client-side 指针。
      自动 stride 推断（stride=0 时按属性偏移计算）。
      vertex_pointer_array_t 归一化处理完整。
      glClientActiveTexture 未记录到显示列表 (有 TODO 注释)。

  - category: "雾效 Fog"
    status: done
    functions:
      - glEnable(GL_FOG)
      - glDisable(GL_FOG)
      - glFogf
      - glFogi
      - glFogfv
      - glFogiv
    notes: >
      三种雾模式 (GL_LINEAR / GL_EXP / GL_EXP2) 均在 Shader 中动态生成。
      雾参数 (color, density, start, end) 通过 uniform 传递。
      fog_index 和 fog_coord_src 状态已存储。

  - category: "Alpha 测试 Alpha Test"
    status: done
    functions:
      - glEnable(GL_ALPHA_TEST)
      - glDisable(GL_ALPHA_TEST)
      - glAlphaFunc
    notes: >
      全部 8 种比较函数 (GL_NEVER/LESS/EQUAL/LEQUAL/GREATER/NOTEQUAL/GEQUAL/ALWAYS)
      在 Fragment Shader 中通过 discard 实现。

  - category: "显示列表 Display Lists"
    status: done
    functions:
      - glGenLists
      - glDeleteLists
      - glIsList
      - glNewList
      - glEndList
      - glCallList
      - glCallLists
      - glListBase
    notes: >
      COMPILE 和 COMPILE_AND_EXECUTE 模式均支持。
      模板化命令记录系统 (GLFuncCmd<auto FuncPtr, Args...>)。
      指针参数支持深拷贝。
      glCallLists 支持所有偏移类型 (BYTE/UBYTE/SHORT/USHORT/INT/UINT/FLOAT/2_BYTES/3_BYTES/4_BYTES)。

  - category: "着色器生成 Shader Generation"
    status: done
    functions:
      - fpe_shader_generator::generate_program
      - fpe_shader_generator::vertex_shader
      - fpe_shader_generator::fragment_shader
    notes: >
      动态 GLSL ES 3.0 生成。
      根据状态 hash (XXHash64) 缓存编译好的 program。
      自动生成: 矩阵变换、顶点颜色传递、雾效、Alpha Test。
      program_t 封装了 compile/link 流程。

